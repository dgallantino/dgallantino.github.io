<article class="card">
  <a class="card-link" href="{{ project.url | relative_url }}">
    {% if project.image %}
      <img class="card-image" src="{{ project.image | relative_url }}" alt="" width="640" height="360">
    {% endif %}
    <h3>{{ project.title }}</h3>
    <p>{{ project.summary }}</p>
  </a>
  <ul class="tags">
    {% for item in project.stack %}
      <li>{{ item }}</li>
    {% endfor %}
    {% if project.status == 'in-progress' %}
      <li class="tag-status">In progress</li>
    {% endif %}
  </ul>
</article>
