url: https://dgallantino.github.io
title: Dimas Gallantino
email: dimas.galant@gmail.com
author: Dimas Gallantino
description: Selected projects — systems, CLIs, and small products.
lang: en
theme: null
markdown: kramdown
permalink: pretty
exclude:
  - vendor
  - Gemfile
  - Gemfile.lock
  - README.md
  - .bundle
plugins:
  - jekyll-seo-tag

collections:
  projects:
    output: true
    permalink: /work/:name/

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project
  - scope:
      path: ""
      type: pages
    values:
      layout: page

social:
  - title: GitHub
    url: https://github.com/dgallantino
  - title: LinkedIn
    url: https://www.linkedin.com/in/dgallantino
  - title: Email
    url: mailto:dimas.galant@gmail.com
